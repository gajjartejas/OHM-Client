buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath("com.google.gms:google-services:4.4.2")
        classpath("com.google.firebase:firebase-crashlytics-gradle:3.0.2")
    }
}

apply plugin: "com.facebook.react.rootproject"

static def resolveNodeExecutable() {
    if (System.env.NODE_BINARY && new File(System.env.NODE_BINARY).exists()) {
        return System.env.NODE_BINARY
    }
    def standardPaths = [
            "/opt/homebrew/bin/node",
            "/usr/local/bin/node",
            "/usr/bin/node",
            "/bin/node"
    ]
    for (path in standardPaths) {
        if (new File(path).exists()) {
            return path
        }
    }
    def userHome = System.getProperty("user.home") ?: ""
    if (userHome) {
        def nvmDir = new File(userHome, ".nvm/versions/node")
        if (nvmDir.exists() && nvmDir.isDirectory()) {
            def nvmNodes = nvmDir.listFiles()?.findAll { it.isDirectory() }
                    ?.collect { new File(it, "bin/node") }
                    ?.findAll { it.exists() }
                    ?.sort { a, b -> b.parentFile.parentFile.name <=> a.parentFile.parentFile.name }
            if (nvmNodes && !nvmNodes.isEmpty()) {
                return nvmNodes.first().absolutePath
            }
        }
        def managerPaths = [
                "$userHome/.local/share/fnm/current/bin/node",
                "$userHome/.fnm/current/bin/node",
                "$userHome/.volta/bin/node",
                "$userHome/.asdf/shims/node",
                "$userHome/.nodenv/shims/node"
        ]
        for (path in managerPaths) {
            if (new File(path).exists()) {
                return path
            }
        }
    }
    return "node"
}

allprojects {
    plugins.withId("com.facebook.react") {
        def reactExt = project.extensions.findByName("react")
        if (reactExt != null) {
            reactExt.nodeExecutableAndArgs.set([resolveNodeExecutable()])
        }
    }
}
